name: Dependencies via CMake

# Exercises the -DPCEE2_BUILD_DEPS=ON path from issue #17 on its own: configure
# pcee2-libretro/deps and build it into a prefix, which is all that path does
# before the core's configure picks the results up. The jobs that build the core
# still take the platform scripts, so nothing here is on the release path - this
# is the only thing that covers deps/CMakeLists.txt, and the macOS and Windows
# branches of it in particular.

on:
  push:
    paths:
      - 'pcee2-libretro/deps/**'
      - 'pcee2-libretro/scripts/deps.versions'
      - 'cmake/BuildDependencies.cmake'
      - '.github/workflows/deps_cmake.yml'
  pull_request:
    paths:
      - 'pcee2-libretro/deps/**'
      - 'pcee2-libretro/scripts/deps.versions'
      - 'cmake/BuildDependencies.cmake'
      - '.github/workflows/deps_cmake.yml'
  workflow_dispatch:

jobs:
  deps:
    name: "deps-${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Packages (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Packages (macOS)
        if: matrix.name == 'macos'
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Locate vcvars (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`call vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          echo VCVARSPATH=%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat>>%GITHUB_ENV%

      - name: Build Dependencies (Unix)
        if: matrix.name != 'windows'
        run: |
          cmake -S pcee2-libretro/deps -B build-deps -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/deps-prefix"
          cmake --build build-deps

      - name: Build Dependencies (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          call "%VCVARSPATH%" || exit /b
          cmake -S pcee2-libretro\deps -B build-deps -G Ninja -DCMAKE_INSTALL_PREFIX=%cd%\deps-prefix || exit /b
          cmake --build build-deps || exit /b

      - name: What got installed
        shell: bash
        run: ls -l deps-prefix/lib

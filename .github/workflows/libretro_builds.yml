name: 🕹️ Libretro Core Builds

on:
  push:
    branches:
      - libretro
  workflow_dispatch:

jobs:
  build_linux:
    name: "Linux x86_64"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang liblz4-dev libwebp-dev \
            libshaderc-dev libcurl4-openssl-dev libpcap-dev libfontconfig-dev \
            libudev-dev libx11-dev libxrandr-dev libxext-dev extra-cmake-modules \
            libwayland-dev libegl-dev libdbus-1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev zlib1g-dev libzstd-dev libdrm-dev libxkbcommon-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: linux-libretro-deps ${{ hashFiles('pcsx2-libretro/scripts/build-deps-linux.sh') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash pcsx2-libretro/scripts/build-deps-linux.sh "$PWD/deps"

      - name: Generate CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DCMAKE_PREFIX_PATH="$PWD/deps" \
            -DSHADERC_LIBRARY=/usr/lib/x86_64-linux-gnu/libshaderc.so.1 \
            -DDISABLE_ADVANCE_SIMD=ON

      - name: Build Core
        run: cmake --build build --target pcsx2-libretro

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcee2_libretro-linux-x86_64
          path: |
            build/bin/pcee2_libretro.so
            pcsx2-libretro/pcee2_libretro.info

  build_windows:
    name: "Windows x64 (MSVC)"
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Locate vcvars
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`call vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          echo VCVARSPATH=%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat>>%GITHUB_ENV%

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: windows-libretro-deps ${{ hashFiles('.github/workflows/scripts/windows/build-dependencies.bat', '.github/workflows/scripts/common/*.patch') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          DEBUG: 0
          BUILD_FFMPEG: 0
        run: .github/workflows/scripts/windows/build-dependencies.bat

      - name: Generate CMake
        shell: cmd
        run: |
          call "%VCVARSPATH%" || exit /b
          cmake . -B build "-DCMAKE_PREFIX_PATH=%cd%\deps" -DCMAKE_BUILD_TYPE=Release -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON -DDISABLE_ADVANCE_SIMD=ON -G Ninja

      - name: Build Core
        shell: cmd
        run: |
          call "%VCVARSPATH%" || exit /b
          cmake --build build --target pcsx2-libretro || exit /b

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcee2_libretro-windows-x64
          path: |
            build/bin/pcee2_libretro.dll
            pcsx2-libretro/pcee2_libretro.info

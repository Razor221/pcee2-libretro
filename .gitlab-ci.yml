# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This drives the libretro buildbot, the same way nuance-linux-libretro does.
#
# NOTE: unlike most libretro cores, pcee2 (a PCSX2 fork) is heavy:
#   * it needs a set of pre-built dependencies (shaderc, etc.) produced by
#     pcee2-libretro/scripts/build-deps-linux.sh into $CI_PROJECT_DIR/deps,
#   * it builds with clang + Ninja,
#   * it is currently Linux x86_64 + Vulkan only and flagged experimental
#     (see pcee2-libretro/pcee2_libretro.info).
# The build flags below mirror .github/workflows/libretro_builds.yml.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

.core-defs:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CORENAME: pcee2
    # cmake configure args (passed by the libretro cmake template as CORE_ARGS)
    # NOTE: PCSX2 officially supports only Clang/MSVC, but the libretro build
    # images ship ancient apt clang (3.8 on xenial / 6.0 on bionic) with no C++20
    # and too old a glibc to drop in a modern clang. The images' native gcc9 is
    # the only C++20-capable compiler here, so build with it (no clang override).
    # CMAKE_FIND_ROOT_PATH: the Windows MXE toolchain sets the find-root-path
    # modes to ONLY in its toolchain file, which shadows any -D...MODE=BOTH we
    # pass on the command line, so find_package(JPEG/Zstd/...) ignored
    # CMAKE_PREFIX_PATH=deps. Adding deps to CMAKE_FIND_ROOT_PATH makes it
    # searched even under ONLY. No-op on Linux (deps is already in PREFIX_PATH).
    CORE_ARGS: >-
      -DENABLE_LIBRETRO=ON
      -DENABLE_QT_UI=OFF
      -DENABLE_TESTS=OFF
      -DDISABLE_ADVANCE_SIMD=ON
      -DSHADERC_STATIC=ON
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/deps
      -DSHADERC_LIBRARY=$CI_PROJECT_DIR/deps/lib/libshaderc_combined.a
      -DCMAKE_FIND_ROOT_PATH=$CI_PROJECT_DIR/deps
    # the libretro target name (output: build/bin/pcee2_libretro.so)
    MAKE_ARGS: pcee2-libretro

include:
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'
  # Windows: MXE MinGW cross-build (provides .libretro-windows-cmake-x86_64 used
  # by libretro-build-windows-x64 below). PCSX2 officially targets MSVC, but the
  # buildbot's only MSVC runner is Visual Studio 2019 16.8 (cl 19.28), which is
  # too old for the C++20 the code uses: no std::make_unique_for_overwrite in its
  # STL, C2326 on constexpr pointers read inside lambdas (GSState::DumpVertices),
  # C3615 on GSDevice11::OMBlendSelector. There is no msvc22 template in
  # ci-templates, so cross-build with the MXE gcc11 toolchain instead.
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

  # Android: the NDK cross-build, for the Play Store RetroArch (issue #10).
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

  # macOS: same story as Linux — the Apple runners carry none of PCSX2's pinned
  # dependency versions, so the jobs below build them from source first with
  # scripts/build-deps-macos.sh. Both slices are built, x86_64 by cross-compiling
  # (the buildbot's Intel and Apple Silicon runners carry different tags, so the
  # two templates pick the machine).
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-x86.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-arm64.yml'

# The stock libretro build images are ancient Ubuntu (xenial/bionic): their
# CMake (3.20), gcc, and system libs (PNG 1.2, zstd, webp, lz4) are far too old
# for PCSX2's pinned versions (PNG 1.6.40, zstd 1.5.5, ...). Override the image
# with ubuntu:24.04, which satisfies all of them, and apt-install the toolchain
# plus the -dev packages the core's SearchForStuff.cmake looks for. SDL3,
# plutovg/plutosvg, ryml, shaderc and FreeType are still built from source by
# build-deps-linux.sh into $CI_PROJECT_DIR/deps.
.pcee2-setup-linux: &pcee2-setup-linux
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update
  # Package list mirrors .github/workflows/libretro_builds.yml (the authoritative
  # set), minus clang and libshaderc-dev (we build with gcc and build shaderc /
  # FreeType from source), plus the basics needed to run the deps build.
  - apt-get install -y --no-install-recommends
      git ca-certificates curl build-essential cmake ninja-build python3 pkg-config extra-cmake-modules
      liblz4-dev libwebp-dev libcurl4-openssl-dev libpcap-dev libfontconfig-dev
      libudev-dev libx11-dev libxrandr-dev libxext-dev libwayland-dev libegl-dev libdbus-1-dev
      libjpeg-turbo8-dev libpng-dev zlib1g-dev libzstd-dev libdrm-dev libxkbcommon-dev
      libpipewire-0.3-dev libpulse-dev libasound2-dev
      libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxrender-dev
      libxss-dev libxtst-dev libgl1-mesa-dev libdecor-0-dev libgbm-dev
  - cmake --version && gcc --version
  # The libretro template builds with `-j $NUMPROC`; our before_script overrides
  # the one that sets it, so cap it ourselves by available RAM (~2 GB per gcc13
  # job) to avoid OOM-killing cc1plus on the big PCSX2 translation units.
  - NUMPROC=$(nproc); MEMGB=$(awk '/MemTotal/{print int($2/1024/1024)}' /proc/meminfo)
  - CAP=$((MEMGB/2)); [ "$CAP" -lt 1 ] && CAP=1; [ "$NUMPROC" -gt "$CAP" ] && NUMPROC=$CAP
  - export NUMPROC; echo "NUMPROC=$NUMPROC (cores=$(nproc), mem=${MEMGB}GB)"

# Build the dependency tree (shaderc, ...) before configuring the core.
# Runs in the libretro build image; mirrors the GitHub Actions deps step.
# SDL3 and libjpeg go inside the core rather than being linked against. SDL3 is
# too new to be packaged by most distributions, and the libjpeg SONAME differs
# between them - Ubuntu, where this builds, has libjpeg.so.8, while Debian ships
# libjpeg.so.62 - so either one turns into a core the frontend cannot load at
# all on the wrong machine.
.pcee2-deps-linux: &pcee2-deps-linux
  - PCEE2_SDL_STATIC=1 PCEE2_BUILD_JPEG=1 bash pcee2-libretro/scripts/build-deps-linux.sh "$CI_PROJECT_DIR/deps"

# The Android image has the NDK but not the tools the dependency recipe drives,
# and none of the libraries either - everything it needs is built from source
# into $CI_PROJECT_DIR/deps first, exactly like the Windows cross-build.
.pcee2-deps-macos: &pcee2-deps-macos
  # Replaces the osx template's before_script, so NUMPROC has to be set here too
  # — and with sysctl, since `nproc` is a coreutils binary that may not be on a
  # stock macOS runner. The deps prefix is per-slice: a static library of the
  # wrong architecture fails at link, not at configure, so an x86_64 and an
  # arm64 build must never share one.
  - export NUMPROC=$(($(sysctl -n hw.ncpu)/5))
  - brew list ninja >/dev/null 2>&1 || brew install ninja
  - brew list nasm >/dev/null 2>&1 || brew install nasm
  - OSX_ARCH=$ARCH bash pcee2-libretro/scripts/build-deps-macos.sh "$CI_PROJECT_DIR/deps"

.pcee2-setup-android: &pcee2-setup-android
  - export DEBIAN_FRONTEND=noninteractive
  - apt-get update
  - apt-get install -y --no-install-recommends cmake ninja-build python3 git ca-certificates
  # The template's own before_script - the one that sets the NUMPROC its build
  # line passes to -j - is replaced by this one, so set it here, capped by
  # available RAM the same way the Linux jobs do.
  - NUMPROC=$(nproc); MEMGB=$(awk '/MemTotal/{print int($2/1024/1024)}' /proc/meminfo)
  - CAP=$((MEMGB/2)); [ "$CAP" -lt 1 ] && CAP=1; [ "$NUMPROC" -gt "$CAP" ] && NUMPROC=$CAP
  - export NUMPROC; echo "NUMPROC=$NUMPROC (cores=$(nproc), mem=${MEMGB}GB)"
  - |
    if [ ! -f "$CI_PROJECT_DIR/deps/lib/libshaderc_combined.a" ]; then
      ANDROID_NDK="$NDK_ROOT" ANDROID_ABI="$ANDROID_ABI" ANDROID_API="$API_LEVEL" \
        bash pcee2-libretro/scripts/build-deps-android.sh "$CI_PROJECT_DIR/deps"
    fi

stages:
  - build-prepare
  - build-shared

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Linux 64-bit (x86_64).
libretro-build-linux-x64:
  image: ubuntu:24.04
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs
  before_script:
    - *pcee2-setup-linux
    - *pcee2-deps-linux

# Linux ARM 64-bit (aarch64). pcee2 ships aarch64 builds; the buildbot
# provides an aarch64 image/runner via .libretro-linux-cmake-aarch64.
libretro-build-linux-aarch64:
  image: ubuntu:24.04
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs
  before_script:
    - *pcee2-setup-linux
    - *pcee2-deps-linux

# Windows 64-bit (MXE MinGW cross-build, on the Linux buildbot image). See the
# include above for why this is not the MSVC job any more.
#
# find_package() in cmake/SearchForStuff.cmake REQUIREs PNG, JPEG, ZLIB, Zstd,
# LZ4, WebP, SDL3, Freetype, plutovg, plutosvg, ryml and Shaderc. None of those
# live in PCSX2's vendored 3rdparty, so — exactly like the Linux jobs — the deps
# are built from source into $CI_PROJECT_DIR/deps first, here with the MXE cmake
# wrapper (build-deps-linux.sh honours $CMAKE/$HOST for exactly this job).
# Without it CMake configure fails immediately with "Could NOT find PNG/ZLIB".
libretro-build-windows-x64:
  # Still experimental for pcee2 until proven green; keep it from failing the
  # pipeline (Linux x64/aarch64 are the shipping targets).
  allow_failure: true
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  before_script:
    - !reference [.libretro-windows-cmake, before_script]
    # The MXE image is a build image, but the deps recipe additionally needs
    # ninja, python3 (shaderc's git-sync-deps) and git.
    - apt-get update && apt-get install -y --no-install-recommends ninja-build python3 git ca-certificates
    - |
      if [ ! -f "$CI_PROJECT_DIR/deps/lib/libshaderc_combined.a" ]; then
        CMAKE=x86_64-w64-mingw32.static-cmake HOST=x86_64-w64-mingw32.static \
        PCEE2_SDL_STATIC=1 \
          ./pcee2-libretro/scripts/build-deps-linux.sh "$CI_PROJECT_DIR/deps"
      fi
  # Building ~15 static libraries from source on every pipeline is wasteful; key
  # the cache on the deps script so it is reused until the recipe changes.
  cache:
    key:
      files:
        - pcee2-libretro/scripts/build-deps-linux.sh
    paths:
      - deps/
  variables:
    # CORE_ARGS comes from .core-defs unchanged: it already carries the MXE
    # CMAKE_FIND_ROOT_PATH workaround and the static .a shaderc path.
    # MinGW/Ninja is a single-config generator, so the .dll lands straight in bin.
    EXTRA_PATH: bin

# Android. Both ABIs the Play Store build ships; API 24 is the floor because the
# frontend's VFS handles are wrapped in stdio streams through funopen64, which
# arrives there.
#
# Both ABIs came up green on the buildbot the first time they ran there
# (pipeline 100833), so these count like the Linux jobs do.
.pcee2-android:
  extends:
    - .core-defs
  before_script:
    - *pcee2-setup-android
  cache:
    key:
      files:
        - pcee2-libretro/scripts/build-deps-android.sh
      prefix: android-$ANDROID_ABI
    paths:
      - deps/
  variables:
    API_LEVEL: 24

# macOS 64-bit (Intel) and ARM64 (Apple Silicon). Both are new targets for
# pcee2: the x86_64 slice is what .github/workflows/libretro_builds.yml already
# builds on every push, the arm64 one runs the interpreter (pcsx2/arm64 is
# recompiler stubs), so it is slow but complete. Kept non-blocking until the
# buildbot has run them green, like the Windows job above.
#
# The deps build is long on a cold runner; the cache keeps it to the first
# pipeline. Keys are per-slice for the same reason the prefixes are.
libretro-build-osx-x64:
  allow_failure: true
  extends:
    - .libretro-osx-cmake-x86
    - .core-defs
  cache:
    key: "pcee2-deps-osx-x64"
    paths:
      - deps/
  before_script:
    - *pcee2-deps-macos

libretro-build-osx-arm64:
  allow_failure: true
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs
  cache:
    key: "pcee2-deps-osx-arm64"
    paths:
      - deps/
  before_script:
    - *pcee2-deps-macos

libretro-build-android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .pcee2-android

libretro-build-android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .pcee2-android
